[workspace]
resolver = "2"
members = [
    "crates/continuum-core",
    "crates/continuum-config",
    "crates/continuum-telemetry",
    "crates/continuum-markdown",
    "crates/continuum-storage",
    "crates/continuum-memory",
    "crates/continuum-models",
    "crates/continuum-models-registry",
    "crates/continuum-sandbox",
    "crates/continuum-tools",
    "crates/continuum-tools-linters",
    "crates/continuum-tools-security",
    "crates/continuum-tools-testing",
    "crates/continuum-tools-browser",
    "crates/continuum-repo",
    "crates/continuum-planner",
    "crates/continuum-agents",
    "crates/continuum-validation",
    "crates/continuum-security",
    "crates/continuum-recovery",
    "crates/continuum-runtime",
    "crates/continuum-cli",
    "xtask",
]

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/continuum-rs/continuum"
authors = ["Continuum Contributors"]
version = "0.0.0"

[workspace.dependencies]
# Internal
continuum-core              = { path = "crates/continuum-core" }
continuum-config            = { path = "crates/continuum-config" }
continuum-telemetry         = { path = "crates/continuum-telemetry" }
continuum-markdown          = { path = "crates/continuum-markdown" }
continuum-storage           = { path = "crates/continuum-storage" }
continuum-memory            = { path = "crates/continuum-memory" }
continuum-models            = { path = "crates/continuum-models" }
continuum-models-registry   = { path = "crates/continuum-models-registry" }
continuum-sandbox           = { path = "crates/continuum-sandbox" }
continuum-tools             = { path = "crates/continuum-tools" }
continuum-tools-linters     = { path = "crates/continuum-tools-linters" }
continuum-tools-security    = { path = "crates/continuum-tools-security" }
continuum-tools-testing     = { path = "crates/continuum-tools-testing" }
continuum-tools-browser     = { path = "crates/continuum-tools-browser" }
continuum-repo              = { path = "crates/continuum-repo" }
continuum-planner           = { path = "crates/continuum-planner" }
continuum-agents            = { path = "crates/continuum-agents" }
continuum-validation        = { path = "crates/continuum-validation" }
continuum-security          = { path = "crates/continuum-security" }
continuum-recovery          = { path = "crates/continuum-recovery" }
continuum-runtime           = { path = "crates/continuum-runtime" }

# Core async
tokio                       = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "process", "time", "signal"] }
tokio-util                  = { version = "0.7", features = ["rt"] }
async-trait                 = "0.1"
futures                     = "0.3"

# Serialization
serde                       = { version = "1", features = ["derive"] }
serde_json                  = "1"
toml                        = "0.8"

# Errors / IDs / time
thiserror                   = "1"
uuid                        = { version = "1", features = ["v4", "serde"] }
time                        = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }

# Logging / telemetry
tracing                     = "0.1"
tracing-subscriber          = { version = "0.3", features = ["env-filter", "fmt", "json"] }
opentelemetry               = "0.24"
opentelemetry-otlp          = "0.17"
opentelemetry_sdk           = { version = "0.24", features = ["rt-tokio"] }
tracing-opentelemetry       = "0.25"
metrics                     = "0.23"
metrics-exporter-prometheus = "0.15"

# CLI / UI
clap                        = { version = "4", features = ["derive", "env", "wrap_help"] }
ratatui                     = "0.28"
crossterm                   = "0.28"
console                     = "0.15"

# Storage
sqlx                        = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "time", "uuid"] }

# HTTP / config
reqwest                     = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
figment                     = { version = "0.10", features = ["env", "toml"] }
directories                 = "5"

# Parsing
pulldown-cmark              = "0.12"
gray_matter                 = "0.2"
serde_yaml                  = "0.9"
regex                       = "1"

# Repo intelligence
tree-sitter                 = "0.22"
tree-sitter-rust              = "0.24"
tree-sitter-typescript          = "0.23"
ignore                      = "0.4"
walkdir                     = "2"
petgraph                    = "0.6"

# Sandbox
bollard                     = "0.17"

# Misc
phf                         = { version = "0.11", features = ["macros"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
