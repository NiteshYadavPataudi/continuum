[package]
name = "continuum-sandbox"
description = "Sandbox runtime for Continuum. Docker today, Firecracker future."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
version.workspace = true

[dependencies]
continuum-core      = { workspace = true }
continuum-config    = { workspace = true }
continuum-telemetry = { workspace = true }
tokio               = { workspace = true }
async-trait         = { workspace = true }
futures             = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }
thiserror           = { workspace = true }
bollard             = { workspace = true }
tar                 = "0.4"
tracing             = { workspace = true }

[features]
default = ["sandbox-docker"]
sandbox-docker = []
sandbox-firecracker = []

[lints.rust]
unsafe_code = "forbid"
