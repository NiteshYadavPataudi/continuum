[package]
name = "continuum-tools-linters"
description = "Linter integrations for Continuum (Biome, ESLint, Ruff, Clippy)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
version.workspace = true

[dependencies]
continuum-core    = { workspace = true }
continuum-sandbox = { workspace = true }
continuum-tools   = { workspace = true }
async-trait       = { workspace = true }
futures           = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }

[features]
default = ["biome", "eslint", "ruff", "clippy"]
biome  = []
eslint = []
ruff   = []
clippy = []

[lints.rust]
unsafe_code = "forbid"
