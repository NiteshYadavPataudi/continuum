[package]
name = "continuum-tools-browser"
description = "Browser automation for Continuum (Playwright via Node subprocess; chromiumoxide fallback)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
version.workspace = true

[dependencies]
continuum-core    = { workspace = true }
continuum-sandbox = { workspace = true }
continuum-tools   = { workspace = true }
async-trait       = { workspace = true }
serde             = { workspace = true }
futures           = { workspace = true }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }

[features]
default = ["playwright"]
# Default driver: Playwright via Node subprocess (full API surface).
playwright = []
# Fallback driver: native Rust CDP via chromiumoxide.
chromiumoxide = []

[lints.rust]
unsafe_code = "forbid"
