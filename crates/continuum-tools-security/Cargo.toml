[package]
name = "continuum-tools-security"
description = "Security tooling integrations (OWASP ZAP, Semgrep, Trivy, Gitleaks)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
version.workspace = true

[dependencies]
continuum-core    = { workspace = true }
continuum-sandbox = { workspace = true }
continuum-tools   = { workspace = true }
async-trait       = { workspace = true }
futures           = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
tracing           = { workspace = true }

[features]
default = ["semgrep", "trivy", "gitleaks"]
zap      = []
semgrep  = []
trivy    = []
gitleaks = []

[lints.rust]
unsafe_code = "forbid"
