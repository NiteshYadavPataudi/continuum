rules:
  - id: hardcoded-secret
    patterns:
      - pattern: |
          let $KEY = "..."
      - metavariable-regex:
          metavariable: $KEY
          regex: (password|secret|token|api_key|apikey|auth|credential)
    message: Potential hardcoded secret
    severity: ERROR
    languages: [rust, python, go, typescript, javascript]
