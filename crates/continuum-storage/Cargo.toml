[package]
name = "continuum-storage"
description = "Centralised SQLite + vector-index persistence for Continuum."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
version.workspace = true

[dependencies]
continuum-core = { workspace = true }
tokio          = { workspace = true }
async-trait    = { workspace = true }
serde          = { workspace = true }
serde_json     = { workspace = true }
thiserror      = { workspace = true }
sqlx           = { workspace = true }
uuid           = { workspace = true }
tracing        = { workspace = true }

[features]
default = ["vector-sqlite"]
# Default vector backend: sqlite-vec extension on the existing SQLite pool.
vector-sqlite = []
# Optional vector backend: Qdrant via a sidecar container.
vector-qdrant = []

[lints.rust]
unsafe_code = "forbid"
